name: Deploy with Docker Compose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docker-compose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-testing:
    if: github.ref == 'refs/heads/develop' && vars.TESTING_COMPOSE_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, fullstack-testing]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, migrate and start application
        env:
          DOMAIN: ${{ vars.TESTING_DOMAIN }}
          PROJECT_NAME: ${{ vars.TESTING_PROJECT_NAME }}
          FIRST_SUPERUSER: ${{ vars.TESTING_FIRST_SUPERUSER }}
          SMTP_HOST: ${{ vars.TESTING_SMTP_HOST }}
          SMTP_USER: ${{ vars.TESTING_SMTP_USER }}
          EMAILS_FROM_EMAIL: ${{ vars.TESTING_EMAILS_FROM_EMAIL }}
          SENTRY_DSN: ${{ vars.TESTING_SENTRY_DSN }}
          SECRET_KEY: ${{ secrets.TESTING_SECRET_KEY }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.TESTING_FIRST_SUPERUSER_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.TESTING_SMTP_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.TESTING_POSTGRES_PASSWORD }}
        run: bash scripts/deploy-docker-compose.sh fullstack-testing

  deploy-production:
    if: github.ref == 'refs/heads/master' && vars.PRODUCTION_COMPOSE_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, fullstack-production]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, migrate and start application
        env:
          DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          PROJECT_NAME: ${{ vars.PRODUCTION_PROJECT_NAME }}
          FIRST_SUPERUSER: ${{ vars.PRODUCTION_FIRST_SUPERUSER }}
          SMTP_HOST: ${{ vars.PRODUCTION_SMTP_HOST }}
          SMTP_USER: ${{ vars.PRODUCTION_SMTP_USER }}
          EMAILS_FROM_EMAIL: ${{ vars.PRODUCTION_EMAILS_FROM_EMAIL }}
          SENTRY_DSN: ${{ vars.PRODUCTION_SENTRY_DSN }}
          SECRET_KEY: ${{ secrets.PRODUCTION_SECRET_KEY }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.PRODUCTION_FIRST_SUPERUSER_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.PRODUCTION_SMTP_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASSWORD }}
        run: bash scripts/deploy-docker-compose.sh fullstack-production
